<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categorias | The Big Foot</title>

  <!-- Bootstrap 5 e Bootstrap Icons via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    .categoria-card {
      transition: transform .2s, box-shadow .2s;
    }
    .categoria-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15);
    }
    .categoria-icone {
      font-size: 3rem;
    }
  </style>
</head>
<body class="bg-light">

  <!-- Menu -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#"><i class="bi bi-shop"></i> Minha Loja</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Início</a></li>
          <li class="nav-item"><a class="nav-link active" href="#">Categorias</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contato</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Título -->
  <header class="py-5 text-center">
    <div class="container">
      <h1 class="fw-bold">Cardapio</h1>
      <p class="text-muted mb-0">Escolha uma categoria e encontre o que você procura</p>
    </div>
  </header>

  <!-- Categorias -->
  <main class="container pb-5">
    {% block content%}

    {%endblock%}
  </main>

  <!-- Rodapé -->
  <footer class="bg-dark text-white-50 text-center py-3">
    <small>&copy; 2026 Minha Loja. Todos os direitos reservados.</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
