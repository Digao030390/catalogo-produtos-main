{% extends 'site/base.html' %}

{% block tittle %} Inicio{% endblock %}


{% block content %}

<div class="row g-4">

  {% for item in categoria %}

  <div class="col-6 col-md-4 col-lg-3">
    <a href="{{url_for('verCategoria', id=item['id'])}}" class="text-decoration-none">
      <div class="card categoria-card h-100 text-center border-0 shadow-sm">
        <div class="card-body py-4">
          <i class="bi bi-phone categoria-icone text-primary"></i>
          <h5 class="card-title mt-3 text-dark">{{item['nome']}}</h5>
          <p class="card-text text-muted small">{{item['descricao']}}</p>
          
        </div>
      </div>
    </a>
  </div>
  {% else %}
    <p>Nenhuma categoria cadastrada</p>
  {% endfor %}

</div>
{% endblock %}
