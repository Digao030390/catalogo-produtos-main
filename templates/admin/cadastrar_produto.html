{% extends 'admin/base.html' %}

{% block content %}

<h3 style="background-color: rgb(198, 197, 197);">
    Cadastrar produto</h3>

<div class="container">

    <form method="POST" enctype="multipart/form-data">

        <label for="nome_categoria">Nome do produto:</label>
        <input type="text" class="form-control" id="nome_produto" name="nome_produto" required>


        <div class="form-group">
            <label for="preco">Preço:</label>
            <input type="text" class="form-control" id="descricao" name="descricao" required>
        </div>

        <div class=" form-group">
            <label for="ativo" id="ativo" class="form-label">
                Status</label>
            <select class="form-select" name="ativo">
                <option value="True">Ativo</option>
                <option value="False">Inativo</option>
            </select>
        </div>

        <div class=" form-group">
            <label for="imagem">Imagem:</label>
            <input type="file" class="form-control" id="imagem" name="imagem">
        </div>
        <div class="form-group">
            <label for="categoria">Categoria:</label>
            <select class="form-select" id="categoria" name="categoria" required>
                {% for c in categorias %}
                <option value="{{ c.id }}" {% if c.id==produto.id_categoria %}selected{% endif %}>
                    {{ c.nome }}
                </option>
                {% endfor %}
            </select>
        </div>
        <br>

        <button type="submit" class="btn btn-primary mb-2">
            Cadastrar</button>
    </form>
</div>

{% endblock %}
